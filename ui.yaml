# Shared LVGL screens. All touch events go to script `ev` (defined by the top-level config).

lvgl:
  id: lv
  displays: [sensecap_display]
  touchscreens: [sensecap_touchscreen]
  buffer_size: 25%
  default_font: montserrat_24
  theme:
    label:
      text_color: 0xFFB000
  pages:
    # Page 0: every content page. ui.yaml only supplies the empty canvas; hb_ui.h creates the
    # clock, pairing, board, agenda and generic pages inside it at runtime from the screen
    # document, so adding a module is a backend release and not a firmware one.
    - id: content_page
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      pad_all: 0
      widgets:
        # Anchors. A built-in Montserrat bitmap is only compiled in when some widget references
        # it; referencing an esphome `font:` here is what defines USE_LVGL_FONT and so gives
        # Font::get_lv_font(); and the qrcode widget is what turns on LV_USE_QRCODE. hb_ui.h then
        # uses &lv_font_montserrat_NN, id(...)->get_lv_font() and lv_qrcode_create directly.
        # All hidden, none ever drawn.
        - label: {id: anchor_16, x: 0, y: 0, width: 1, height: 1, text: "", text_font: montserrat_16, hidden: true}
        - label: {id: anchor_18, x: 0, y: 0, width: 1, height: 1, text: "", text_font: montserrat_18, hidden: true}
        - label: {id: anchor_20, x: 0, y: 0, width: 1, height: 1, text: "", text_font: montserrat_20, hidden: true}
        - label: {id: anchor_24, x: 0, y: 0, width: 1, height: 1, text: "", text_font: montserrat_24, hidden: true}
        - label: {id: anchor_28, x: 0, y: 0, width: 1, height: 1, text: "", text_font: montserrat_28, hidden: true}
        - label: {id: anchor_clock, x: 0, y: 0, width: 1, height: 1, text: "", text_font: clock_font, hidden: true}
        - label: {id: anchor_pair, x: 0, y: 0, width: 1, height: 1, text: "", text_font: pair_font, hidden: true}
        - label: {id: anchor_icon, x: 0, y: 0, width: 1, height: 1, text: "", text_font: icon_font, hidden: true}
        - label: {id: anchor_wordmark, x: 0, y: 0, width: 1, height: 1, text: "", text_font: wordmark_font, hidden: true}
        - qrcode: {id: anchor_qr, x: 0, y: 0, size: 20, text: "", hidden: true}
    - id: detail_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: detail_hdr
            x: 14
            y: 12
            width: 452
            text: ""
            text_font: montserrat_22
            text_color: 0xFFFFFF
        - line:
            points: [[14, 72], [466, 72]]
            line_color: 0x444444
            line_width: 2
        - label:
            id: detail_body
            x: 14
            y: 84
            width: 452
            height: 346
            text: ""
            text_font: montserrat_20
            text_color: 0xFFB000
        - line:
            points: [[14, 436], [466, 436]]
            line_color: 0x444444
            line_width: 2
        - label:
            id: detail_foot
            x: 14
            y: 446
            width: 452
            text: "Tap to go back"
            text_font: montserrat_16
            text_color: 0x888888
        - obj:
            id: detail_tap
            x: 0
            y: 0
            width: 480
            height: 480
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            clickable: true
            on_short_click:
              - script.execute: {id: ev, msg: "TOUCH"}

    - id: settings_page
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      pad_all: 0
      widgets:
        - label:
            id: set_title
            x: 14
