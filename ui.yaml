      scrollable: false
      pad_all: 0
      widgets:
        - label:
            id: set_title
            x: 14
            y: 10
            width: 132
            height: 26
            text: "From station"
            text_font: montserrat_20
            text_color: 0xFFFFFF
            long_mode: DOT
        # Departures / Arrivals toggle for the board being edited (step 1 only)
        - button:
            id: mode_btn
            x: 150
            y: 6
            width: 118
            height: 32
            bg_color: 0x1E2A44
            radius: 4
            pad_all: 0
            on_click:
              - script.execute: {id: ev, msg: "MODE"}
            widgets:
              - label:
                  id: mode_lbl
                  align: CENTER
                  text: "Departures"
                  text_font: montserrat_16
                  text_color: 0xFFFFFF
        - button:
            id: any_btn
            x: 276
            y: 6
            width: 96
            height: 32
            bg_color: 0x1E2A44
            radius: 4
            pad_all: 0
            on_click:
              - script.execute: {id: ev, msg: "ANY"}
            widgets:
              - label:
                  align: CENTER
                  text: "Any"
                  text_font: montserrat_18
                  text_color: 0xFFFFFF
        - button:
            id: cancel_btn
            x: 380
            y: 6
            width: 86
            height: 32
            bg_color: 0x442020
            radius: 4
            pad_all: 0
            on_click:
              - script.execute: {id: ev, msg: "CANCEL"}
            widgets:
              - label:
                  align: CENTER
                  text: "Cancel"
                  text_font: montserrat_18
                  text_color: 0xFFFFFF
        - textarea:
            id: search_ta
            x: 14
            y: 44
            width: 452
            height: 38
            one_line: true
            max_length: 24
            placeholder_text: "Type a station name or code"
            text_font: montserrat_20
            on_value:
              - lambda: |-
                  id(ev).execute(std::string("Q|") + lv_textarea_get_text(id(search_ta)));
        - button:
            id: match0
            x: 14
            y: 88
            width: 452
            height: 30
            bg_color: 0x1E2A44
            radius: 4
            pad_all: 0
            hidden: true
            on_click:
              - script.execute: {id: ev, msg: "PICK|0"}
