# Fonts beyond LVGL's built-in Montserrat bitmaps. Montserrat Medium comes from Google Fonts at
# build time; the Material Design Icons webfont is checked in under fonts/ with its licence.
font:
  # The clock page. Digits and a colon, plus a space and a hyphen as a safety so a stray
  # separator can never draw as a missing-glyph box at 120 px.
  - file: "gfonts://Montserrat@medium"
    id: clock_font
    size: 120
    bpp: 4
    glyphs: [" -0123456789:"]
  # The boot wordmark. A stand-in for a real logo: only the letters "HallBoard" needs.
  - file: "gfonts://Montserrat@medium"
    id: wordmark_font
    size: 56
    bpp: 4
    glyphs: ["HalBord"]
  # The pairing code. The pairing alphabet has no I, L, O or S (docs/api-v1.md). 64 px is the
  # largest size at which a six-character code plus its separating space always fits 480 px.
  - file: "gfonts://Montserrat@medium"
    id: pair_font
    size: 64
    bpp: 4
    glyphs:
      - " 0123456789"
      - "ABCDEFGHJKMNPQRTUVWXYZ"
  # The twenty icons a generic page may name. See the table in hb_ui.h for the name of each.
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: icon_font
    size: 48
    bpp: 4
    glyphs:
      - "\U000F0599"   # sun       weather-sunny
      - "\U000F0595"   # partly    weather-partly-cloudy
      - "\U000F0590"   # cloud     weather-cloudy
      - "\U000F0597"   # rain      weather-rainy
      - "\U000F0596"   # pour      weather-pouring
      - "\U000F0598"   # snow      weather-snowy
      - "\U000F0591"   # fog       weather-fog
      - "\U000F0593"   # storm     weather-lightning
      - "\U000F059D"   # wind      weather-windy
      - "\U000F0594"   # night     weather-night
      - "\U000F009C"   # bell      bell-outline
      - "\U000F023D"   # flag      flag-outline
      - "\U000F00EE"   # calendar  calendar-blank
      - "\U000F052C"   # train     train
      - "\U000F04DF"   # tube      subway-variant
      - "\U000F00E7"   # bus       bus
      - "\U000F0150"   # clock     clock-outline
      - "\U000F05D6"   # alert     alert-circle-outline
      - "\U000F05A9"   # wifi      wifi
      - "\U000F0339"   # link      link-variant
