# Shared LVGL screens. All touch events go to script `ev` (defined by the top-level config).

lvgl:
  id: lv
  displays: [sensecap_display]
  touchscreens: [sensecap_touchscreen]
  buffer_size: 25%
  default_font: fig500_18
  theme:
    label:
      text_color: 0xF5F4F9
  pages:
    # Page 0: every content page. ui.yaml only supplies the empty canvas; hb_ui.h creates the
    # clock, pairing, board, agenda and generic pages inside it at runtime from the screen
    # document, so adding a module is a backend release and not a firmware one.
    - id: content_page
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      pad_all: 0
      widgets:
        # Anchors. Referencing an esphome `font:` here is what defines USE_LVGL_FONT and so gives
        # Font::get_lv_font(); the qrcode widget is what turns on LV_USE_QRCODE. hb_ui.h then
        # uses id(...)->get_lv_font() and lv_qrcode_create directly. One label per font id, all
        # hidden, none ever drawn. The built-in Montserrat bitmaps need no anchor here: the
        # static pages below still reference them by name.
        - label: {id: anchor_fig600_132, x: 0, y: 0, width: 1, height: 1, text: "", text_font: fig600_132, hidden: true}
        - label: {id: anchor_fig600_88, x: 0, y: 0, width: 1, height: 1, text: "", text_font: fig600_88, hidden: true}
        - label: {id: anchor_fig600_30, x: 0, y: 0, width: 1, height: 1, text: "", text_font: fig600_30, hidden: true}
        - label: {id: anchor_fig600_20, x: 0, y: 0, width: 1, height: 1, text: "", text_font: fig600_20, hidden: true}
        - label: {id: anchor_fig500_22, x: 0, y: 0, width: 1, height: 1, text: "", text_font: fig500_22, hidden: true}
        - label: {id: anchor_fig500_20, x: 0, y: 0, width: 1, height: 1, text: "", text_font: fig500_20, hidden: true}
        - label: {id: anchor_fig500_18, x: 0, y: 0, width: 1, height: 1, text: "", text_font: fig500_18, hidden: true}
        - label: {id: anchor_fig500_16, x: 0, y: 0, width: 1, height: 1, text: "", text_font: fig500_16, hidden: true}
        - label: {id: anchor_fig400_18, x: 0, y: 0, width: 1, height: 1, text: "", text_font: fig400_18, hidden: true}
        - label: {id: anchor_fig700_50, x: 0, y: 0, width: 1, height: 1, text: "", text_font: fig700_50, hidden: true}
        - label: {id: anchor_mono400_64, x: 0, y: 0, width: 1, height: 1, text: "", text_font: mono400_64, hidden: true}
        - label: {id: anchor_mono400_20, x: 0, y: 0, width: 1, height: 1, text: "", text_font: mono400_20, hidden: true}
        - label: {id: anchor_mono400_16, x: 0, y: 0, width: 1, height: 1, text: "", text_font: mono400_16, hidden: true}
        - label: {id: anchor_mono400_15, x: 0, y: 0, width: 1, height: 1, text: "", text_font: mono400_15, hidden: true}
        - label: {id: anchor_mono400_14, x: 0, y: 0, width: 1, height: 1, text: "", text_font: mono400_14, hidden: true}
        - label: {id: anchor_icon, x: 0, y: 0, width: 1, height: 1, text: "", text_font: icon_font, hidden: true}
        - qrcode: {id: anchor_qr, x: 0, y: 0, size: 20, text: "", hidden: true}
    - id: detail_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: detail_hdr
            x: 14
            y: 12
            width: 452
            text: ""
            text_font: montserrat_22
            text_color: 0xFFFFFF
        - line:
