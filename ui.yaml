# Shared LVGL screens. All touch events go to script `ev` (defined by the top-level config).

lvgl:
  id: lv
  displays: [sensecap_display]
  touchscreens: [sensecap_touchscreen]
  buffer_size: 25%
  default_font: montserrat_24
  theme:
    label:
      text_color: 0xFFB000
  pages:
    - id: main_page
      bg_color: 0x000000
      bg_opa: COVER
      widgets:
        - label:
            id: hdr_station
            x: 14
            y: 12
            width: 340
            height: 32
            text: "Train board"
            text_font: montserrat_24
            text_color: 0xFFFFFF
            long_mode: DOT
        - label:
            id: hdr_clock
            align: TOP_RIGHT
            x: -14
            y: 12
            text: "--:--"
            text_font: montserrat_24
            text_color: 0xFFFFFF
        - line:
            points: [[14, 50], [466, 50]]
            line_color: 0x444444
            line_width: 2

        # Row 0: a card; the transparent row0_hit object above it takes the taps
        - obj:
            id: trow0
            x: 14
            y: 60
            width: 452
            height: 68
            bg_color: 0x1C1C1E
            bg_opa: COVER
            radius: 10
            border_width: 3
            border_side: LEFT
            border_color: 0x888888
            pad_all: 0
            scrollable: false
            clickable: false
            hidden: true
            widgets:
              - label: {id: r0_time,   x: 14,  y: 5,  width: 80,  height: 34, text: "", text_font: montserrat_28}
              - label: {id: r0_dest,   x: 96,  y: 5,  width: 262, height: 34, text: "", text_font: montserrat_28, long_mode: DOT}
              - label: {id: r0_plat,   x: 360, y: 5,  width: 78,  height: 34, text: "", text_font: montserrat_28, text_align: RIGHT}
              - label: {id: r0_exp,    x: 14,  y: 41, width: 78,  height: 22, text: "", text_font: montserrat_16, text_color: 0xFFB000}
              - label: {id: r0_status, x: 96,  y: 41, width: 342, height: 22, long_mode: DOT, text: "", text_font: montserrat_16, text_color: 0xC8C8C8}
        # Row 1: a card; the transparent row1_hit object above it takes the taps
        - obj:
            id: trow1
            x: 14
            y: 134
            width: 452
            height: 68
            bg_color: 0x1C1C1E
            bg_opa: COVER
            radius: 10
            border_width: 3
            border_side: LEFT
            border_color: 0x888888
            pad_all: 0
            scrollable: false
            clickable: false
            hidden: true
            widgets:
              - label: {id: r1_time,   x: 14,  y: 5,  width: 80,  height: 34, text: "", text_font: montserrat_28}
              - label: {id: r1_dest,   x: 96,  y: 5,  width: 262, height: 34, text: "", text_font: montserrat_28, long_mode: DOT}
              - label: {id: r1_plat,   x: 360, y: 5,  width: 78,  height: 34, text: "", text_font: montserrat_28, text_align: RIGHT}
              - label: {id: r1_exp,    x: 14,  y: 41, width: 78,  height: 22, text: "", text_font: montserrat_16, text_color: 0xFFB000}
              - label: {id: r1_status, x: 96,  y: 41, width: 342, height: 22, long_mode: DOT, text: "", text_font: montserrat_16, text_color: 0xC8C8C8}
        # Row 2: a card; the transparent row2_hit object above it takes the taps
        - obj:
            id: trow2
            x: 14
            y: 208
            width: 452
            height: 68
            bg_color: 0x1C1C1E
            bg_opa: COVER
            radius: 10
            border_width: 3
            border_side: LEFT
            border_color: 0x888888
            pad_all: 0
            scrollable: false
            clickable: false
            hidden: true
            widgets:
              - label: {id: r2_time,   x: 14,  y: 5,  width: 80,  height: 34, text: "", text_font: montserrat_28}
              - label: {id: r2_dest,   x: 96,  y: 5,  width: 262, height: 34, text: "", text_font: montserrat_28, long_mode: DOT}
              - label: {id: r2_plat,   x: 360, y: 5,  width: 78,  height: 34, text: "", text_font: montserrat_28, text_align: RIGHT}
              - label: {id: r2_exp,    x: 14,  y: 41, width: 78,  height: 22, text: "", text_font: montserrat_16, text_color: 0xFFB000}
              - label: {id: r2_status, x: 96,  y: 41, width: 342, height: 22, long_mode: DOT, text: "", text_font: montserrat_16, text_color: 0xC8C8C8}
        # Row 3: a card; the transparent row3_hit object above it takes the taps
        - obj:
            id: trow3
            x: 14
            y: 282
            width: 452
            height: 68
            bg_color: 0x1C1C1E
            bg_opa: COVER
            radius: 10
            border_width: 3
            border_side: LEFT
            border_color: 0x888888
            pad_all: 0
            scrollable: false
            clickable: false
            hidden: true
            widgets:
              - label: {id: r3_time,   x: 14,  y: 5,  width: 80,  height: 34, text: "", text_font: montserrat_28}
              - label: {id: r3_dest,   x: 96,  y: 5,  width: 262, height: 34, text: "", text_font: montserrat_28, long_mode: DOT}
              - label: {id: r3_plat,   x: 360, y: 5,  width: 78,  height: 34, text: "", text_font: montserrat_28, text_align: RIGHT}
              - label: {id: r3_exp,    x: 14,  y: 41, width: 78,  height: 22, text: "", text_font: montserrat_16, text_color: 0xFFB000}
              - label: {id: r3_status, x: 96,  y: 41, width: 342, height: 22, long_mode: DOT, text: "", text_font: montserrat_16, text_color: 0xC8C8C8}
        # Row 4: a card; the transparent row4_hit object above it takes the taps
        - obj:
            id: trow4
            x: 14
            y: 356
            width: 452
            height: 68
            bg_color: 0x1C1C1E
            bg_opa: COVER
            radius: 10
            border_width: 3
            border_side: LEFT
            border_color: 0x888888
            pad_all: 0
            scrollable: false
            clickable: false
            hidden: true
            widgets:
              - label: {id: r4_time,   x: 14,  y: 5,  width: 80,  height: 34, text: "", text_font: montserrat_28}
              - label: {id: r4_dest,   x: 96,  y: 5,  width: 262, height: 34, text: "", text_font: montserrat_28, long_mode: DOT}
              - label: {id: r4_plat,   x: 360, y: 5,  width: 78,  height: 34, text: "", text_font: montserrat_28, text_align: RIGHT}
              - label: {id: r4_exp,    x: 14,  y: 41, width: 78,  height: 22, text: "", text_font: montserrat_16, text_color: 0xFFB000}
              - label: {id: r4_status, x: 96,  y: 41, width: 342, height: 22, long_mode: DOT, text: "", text_font: montserrat_16, text_color: 0xC8C8C8}

        - line:
            points: [[14, 436], [466, 436]]
            line_color: 0x444444
            line_width: 2
        - label:
            id: footer
            x: 14
            y: 446
            width: 452
            height: 20
            text: "Connect the USB cable and run trainboard.py"
            text_font: montserrat_16
            text_color: 0x888888
            long_mode: DOT
        - obj:
            id: main_tap
            x: 0
            y: 0
            width: 480
            height: 480
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            clickable: true
            on_short_click:
              - script.execute: {id: ev, msg: "TOUCH"}
        # Transparent hit areas over each row: short tap flips board, long press asks for details
        - obj:
            id: row0_hit
            x: 0
            y: 60
            width: 480
            height: 74
            bg_opa: TRANSP
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            clickable: true
            on_short_click:
              - script.execute: {id: ev, msg: "TOUCH"}
            on_long_press:
              - script.execute: {id: ev, msg: "LONG|0"}
