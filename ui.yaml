              text_font: fig500_18
              pressed:
                bg_color: 0x7A5AF8
                text_color: 0xFFFFFF
              checked:
                bg_color: 0x7A5AF8
                text_color: 0xFFFFFF

# The design system's type scale. Figtree carries the text, IBM Plex Mono the times, codes and
# meta lines. Both come from Google Fonts at build time: `gfonts://Family@weight` asks the CSS
# API for that weight and the API answers with a static instance of the variable font, so 500,
# 600 and 700 are three different files and not one file rendered three ways. A family with
# spaces in its name is written with plus signs, as the CSS API wants it. Nothing else is
# compiled in: the icon webfont the generic template used to draw with went with S14, and the
# faces say what it said in type.
#
# Every entry has an explicit glyph list. The text sizes share one: printable ASCII plus the
# degree sign, the middle dot the stamps separate with, both dashes and an ellipsis.
font:
  # The clock face. Digits and a colon and nothing else at 132 px.
  - file: "gfonts://Figtree@600"
    id: fig600_132
    size: 132
    bpp: 4
    glyphs: ["0123456789:"]
  # The temperature hero on the weather face: digits, the degree sign and a minus.
  - file: "gfonts://Figtree@600"
    id: fig600_88
    size: 88
    bpp: 4
    glyphs: ["0123456789°-"]
  - file: "gfonts://Figtree@600"
    id: fig600_30
    size: 30
    bpp: 4
    glyphs: &text_glyphs
      - " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~"
      - "°·–—…"
  - file: "gfonts://Figtree@600"
    id: fig600_20
    size: 20
    bpp: 4
    glyphs: *text_glyphs
  - file: "gfonts://Figtree@500"
    id: fig500_22
    size: 22
    bpp: 4
    glyphs: *text_glyphs
  - file: "gfonts://Figtree@500"
    id: fig500_20
    size: 20
    bpp: 4
    glyphs: *text_glyphs
  - file: "gfonts://Figtree@500"
    id: fig500_18
    size: 18
    bpp: 4
    glyphs: *text_glyphs
  - file: "gfonts://Figtree@500"
    id: fig500_16
    size: 16
    bpp: 4
    glyphs: *text_glyphs
  - file: "gfonts://Figtree@400"
    id: fig400_18
    size: 18
    bpp: 4
    glyphs: *text_glyphs
  # The mark. Two letters, and the tile behind them is drawn rather than set.
  - file: "gfonts://Figtree@700"
    id: fig700_50
    size: 50
    bpp: 4
    glyphs: ["HB"]
  # The pairing code. The pairing alphabet has no I, L, O or S (docs/api-v1.md).
  - file: "gfonts://IBM+Plex+Mono@400"
    id: mono400_64
    size: 64
    bpp: 4
    glyphs: [" 0123456789ABCDEFGHJKMNPQRTUVWXYZ"]
  - file: "gfonts://IBM+Plex+Mono@400"
    id: mono400_20
    size: 20
    bpp: 4
    glyphs: *text_glyphs
  - file: "gfonts://IBM+Plex+Mono@400"
    id: mono400_16
    size: 16
    bpp: 4
    glyphs: *text_glyphs
  - file: "gfonts://IBM+Plex+Mono@400"
    id: mono400_15
    size: 15
    bpp: 4
    glyphs: *text_glyphs
  - file: "gfonts://IBM+Plex+Mono@400"
    id: mono400_14
    size: 14
    bpp: 4
    glyphs: *text_glyphs
