# HallBoard wall display. The ESP32-S3 holds no provider credentials: on first boot it generates
# its own 64-hex device secret, pairs with the HallBoard backend (a pairing page with a QR code
# shows on screen until a household claims it), then polls https://api.hallboard.co.uk for one
# screen document. Every content page is built from that document at runtime by the faces in
# hb_ui.h: the clock first, then the household's boards, diary, weather and to-do, all on one
# horizontal carousel in the HallBoard design system (hb_tokens.h holds the palette, hb_copy.h
# the words). Stations and everything else are set in the portal; the board itself only ever
# shows. See docs/api-v1.md and docs/screen-document.md. No secrets file is needed to build.
#
# Wi-Fi is set up on the device: long-press the side button (0.7 to 6 s), pick a network, type the
# password. Credentials are saved in flash. Holding the button 8 to 15 s is a factory reset: the
# whole NVS partition is erased, so the device secret, the claim and the saved Wi-Fi network all
# go and the board comes back as if it had never been set up. That is what makes a unit safe to
# hand on. NVS encryption (a key the chip derives from an eFuse HMAC key) is parked, not
# rejected: the block that turns it on is in docs/operations.md with its desk checklist, and it
# ships in a release of its own because the first boot of such an image wipes saved settings once.
#
# From Phase 1c the board updates itself: it asks GET /v1/device/firmware for a manifest, streams
# the offered image into the spare app slot over TLS, checks its SHA-256, and reboots into it. The
# bootloader rolls back to the previous slot if the new image never confirms a good boot, which
# safe_mode does once the backend answers (or after ten minutes as the safety net). When it does
# roll back, the old image reports the failed version to the backend on its next boot (fw_pending).
# The bootloader and the partition table are never written.
# Shared parts live in hardware.yaml / ui.yaml; the pages in hb_ui.h, the logic in
# trainboard_logic.h.

substitutions:
  backend_base: "https://api.hallboard.co.uk"
  fw_version: "1.4.5"

esphome:
  name: hallboard
  friendly_name: HallBoard
  includes:
    - hb_copy.h
    - hb_tokens.h
    - hb_ui.h
    - hb_parse.h
    - trainboard_logic.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          tb::g_fw = "${fw_version}";
          // First boot (or after a factory reset): mint the device secret. It is restored from
          // flash on every later boot and is never logged or shown.
          if (!tb::secret_valid(id(device_secret))) {
            tb::fill_secret(id(device_secret));
            id(claimed) = false;
            id(screen_etag).clear();
            ESP_LOGI("hb", "generated a new device secret");
          }
          if (id(cur_board) < 0) id(cur_board) = 0;
          // Fonts the runtime pages draw with, and the way a widget posts an event back to this
          // script. Then build the carousel, clock page first.
          hb::g_fonts.clock168 = id(fig600_168)->get_lv_font();
          hb::g_fonts.hero88 = id(fig600_88)->get_lv_font();
          hb::g_fonts.sans600_30 = id(fig600_30)->get_lv_font();
          hb::g_fonts.sans600_24 = id(fig600_24)->get_lv_font();
          hb::g_fonts.sans600_20 = id(fig600_20)->get_lv_font();
          hb::g_fonts.sans500_22 = id(fig500_22)->get_lv_font();
          hb::g_fonts.sans500_20 = id(fig500_20)->get_lv_font();
          hb::g_fonts.sans500_18 = id(fig500_18)->get_lv_font();
          hb::g_fonts.sans500_16 = id(fig500_16)->get_lv_font();
          hb::g_fonts.sans400_24 = id(fig400_24)->get_lv_font();
          hb::g_fonts.sans400_18 = id(fig400_18)->get_lv_font();
          hb::g_fonts.mark50 = id(fig700_50)->get_lv_font();
          hb::g_fonts.mono64 = id(mono400_64)->get_lv_font();
          hb::g_fonts.mono20 = id(mono400_20)->get_lv_font();
          hb::g_fonts.mono16 = id(mono400_16)->get_lv_font();
          hb::g_fonts.mono15 = id(mono400_15)->get_lv_font();
          hb::g_fonts.mono14 = id(mono400_14)->get_lv_font();
          hb::g_event =[](const std::string &msg) { id(ev).execute(msg); };
          hb::g_host.attach(id(content_page)->obj, "${fw_version}");
          // The backlight is off from power-on (hardware.yaml), because until LVGL has drawn once
          // the RGB panel scans whatever happened to be in PSRAM. Draw the black boot overlay
          // here, synchronously, and only then bring the light up.
          lv_obj_invalidate(lv_screen_active());
          lv_refr_now(nullptr);
          id(applied_brightness) = 100;
          auto bl = id(backlight)->turn_on();
          bl.set_brightness(1.0f);
          bl.set_transition_length(250);
          bl.perform();
      - lambda: |-
          // Straight after an over-the-air update the bootloader leaves the new image pending
          // until the boot is confirmed. Say which version is running while that is true, for a
          // minute at most, and confirm_boot clears it as soon as the backend answers.
          const esp_partition_t *running = esp_ota_get_running_partition();
          esp_ota_img_states_t ota_state = ESP_OTA_IMG_UNDEFINED;
          if (running != nullptr && esp_ota_get_state_partition(running, &ota_state) == ESP_OK &&
              ota_state == ESP_OTA_IMG_PENDING_VERIFY) {
            ESP_LOGI("hb", "running a pending image, version ${fw_version}");
            hb::g_host.set_notice(std::string(hb::copy::UPDATED_TO) + "${fw_version}.");
            id(fw_notice_until) = millis() + 60000;
          }
          // The other outcome: an image was installed, the board rebooted into it, and it never
          // confirmed a good boot, so the bootloader came back to this slot. fw_pending still
          // names what was installed and it is not what is running, which is the whole test.
          // (When the new image boots but only safe_mode's ten-minute net confirms it, fw_pending
          // equals ${fw_version} and a later restart is correctly read as no rollback.)
          if (id(fw_pending)[0] != '\0' && strcmp(id(fw_pending), "${fw_version}") != 0) {
            ESP_LOGW("hb", "rolled back from %s to ${fw_version}", id(fw_pending));
            id(fw_result_body) = std::string("{\"version\":\"") + id(fw_pending) +
                                 "\",\"ok\":false,\"error\":\"rolled_back\"}";
            memset(id(fw_pending), 0, sizeof(id(fw_pending)));
          }
      - lambda: |-
          tb::g_fetcher.start();
          wifi::global_wifi_component->set_keep_scan_results(true);
          if (wifi::global_wifi_component->has_sta()) {
            hb::g_host.set_status(hb::copy::WIFI_CONNECTING);
          } else {
            hb::g_host.set_status(hb::copy::WIFI_NONE_SAVED, true);
            id(ev).execute("BUTTONLONG");
          }
          // A factory reset is a very long hold; the 0.7 to 6 s band in hardware.yaml opens Wi-Fi
          // setup, so the two never overlap.
      - lambda: |-
          // The two pieces of the utility pages' design that ESPHome's LVGL YAML schema has no
          // key for. Everything else on those pages is declared in ui.yaml.
          //
          // 1. The press feedback eases in and out over 120 ms. ui.yaml sets the pressed scale
          // and the ring; a style transition is what animates them, and it needs a descriptor
          // the schema cannot express. It is attached to both states so the button eases back
          // when the finger lifts as well as in when it lands.
          static const lv_style_prop_t press_props[] = {
              LV_STYLE_TRANSFORM_SCALE_X, LV_STYLE_TRANSFORM_SCALE_Y,
              LV_STYLE_OUTLINE_WIDTH, LV_STYLE_OUTLINE_OPA, LV_STYLE_PROP_INV};
          static lv_style_transition_dsc_t press_tr;
          lv_style_transition_dsc_init(&press_tr, press_props, lv_anim_path_ease_out, 120, 0,
                                       nullptr);
          lv_obj_t* press_btns[] = {id(net0), id(net1), id(net2), id(net3), id(net4), id(net5),
                                    id(net6), id(wifi_scan_btn), id(wifi_cancel_btn),
                                    id(wifi_connect_btn), id(wifi_pw_cancel_btn)};
          for (auto* b : press_btns) {
            lv_obj_set_style_transition(b, &press_tr, LV_STATE_DEFAULT);
            lv_obj_set_style_transition(b, &press_tr, LV_STATE_PRESSED);
          }
          // 2. The gap between the keyboard's keys. pad_row / pad_column are layout properties
          // in the schema and not widget style ones, and the keyboard lays itself out.
          lv_obj_set_style_pad_row(id(pw_kb)->obj, 6, LV_PART_MAIN);
          lv_obj_set_style_pad_column(id(pw_kb)->obj, 6, LV_PART_MAIN);

packages:
  hardware: !include hardware.yaml
  ui: !include ui.yaml

# Two app slots and a bootloader rollback. ESPHome marks the running image valid in arch_init
# unless USE_OTA_ROLLBACK is defined, and that needs an `ota:` platform and an enabled `safe_mode:`
# together; with both here, confirming a good boot moves into safe_mode and into our own
# mark_successful() call. hardware.yaml owns the esp32 block; this merges the one key into it.
esp32:
  framework:
    advanced:
      enable_ota_rollback: true

# http_request is the only OTA platform in the config: it opens no socket and nothing listens on
# the device. The install itself is ours (trainboard_logic.h) because ESPHome's flash action is
# MD5-only and cannot carry the device credential; this block exists for the rollback pin above.
ota:
  - platform: http_request

# Five bad boots in a row drop into safe mode; a boot is good once the backend answers (see the
# confirm_boot script) or after ten minutes. boot_is_good_on_shutdown is off so a restart cannot
# confirm an image that has not proved itself.
safe_mode:
  id: safe_mode_1
  num_attempts: 5
  boot_is_good_after: 10min
  boot_is_good_on_shutdown: false
  reboot_timeout: 5min

# No networks in the config: credentials come from the on-device Wi-Fi setup page (saved in flash).
# improv_serial also lets the ESPHome web flasher set Wi-Fi over USB, and satisfies ESPHome's
# requirement that a Wi-Fi provisioning method exists.
wifi:
  power_save_mode: none
  on_connect:
    - lambda: |-
        char ssid[wifi::SSID_BUFFER_SIZE];
        std::string name = wifi::global_wifi_component->wifi_ssid_to(ssid);
        std::string msg = hb::copy::WIFI_CONNECTED_TO + name + ".";
        lv_label_set_text(id(wifi_status), msg.c_str());
        hb::g_host.set_network(name);
        hb::g_host.set_status(id(claimed) ? hb::copy::CONNECTED_FETCHING
                                          : hb::copy::CONNECTED_PAIRING);
        if (id(lv).get_current_page() == 2) id(lv).show_page(0, LV_SCR_LOAD_ANIM_NONE, 0);
        // Pair (or poll the screen) on the next scheduler tick.
        id(backoff_ms) = 0;
        id(next_poll_at) = millis();
  on_disconnect:
    - lambda: |-
        hb::g_host.set_status(hb::copy::WIFI_DROPPED, true);

improv_serial:

# Serial logging is available again on this variant (no UART data link).
logger:
  hardware_uart: UART0
  level: INFO

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/London
    on_time_sync:
      - lambda: |-
          hb::g_host.tick(id(sntp_time).now());
          id(apply_brightness).execute();

# Requests are made by the background task in trainboard_logic.h (esp_http_client directly).
# The component stays in the config so ESPHome enables the TLS certificate bundle.
http_request:
  id: http

json:

globals:
  # Device identity. The secret is 64 lowercase hex characters minted on first boot; ESPHome's
  # restoring globals save it to flash within a second of it changing and again on shutdown.
  - {id: device_secret, type: 'char[65]', restore_value: true}
  - {id: claimed, type: bool, restore_value: true, initial_value: 'false'}
  - {id: screen_etag, type: std::string}
  - {id: pair_code, type: std::string}
  - {id: pair_expires_at, type: uint32_t, initial_value: '0'}
  - {id: next_poll_at, type: uint32_t, initial_value: '0'}
  - {id: last_manual_refresh, type: uint32_t, initial_value: '0'}
  - {id: backoff_ms, type: uint32_t, initial_value: '0'}   # 0, then 30 s doubling to 5 min
  # Local "HH:MM" of the last screen fetch that worked, which is the age of what is still on the
  # wall. Every "cannot reach" sentence ends with it, so the household is told what they are
  # looking at rather than what went wrong; the error code goes to the log.
  - {id: last_good_hm, type: std::string}
  # The POSIX TZ string last handed to the clock, so a document only changes it when it changes.
  - {id: applied_tz, type: std::string}
  - {id: cur_board, type: int, restore_value: true, initial_value: '0'}   # carousel index, restored across boots
  - {id: page_restored, type: bool, initial_value: 'false'}
  - {id: detail_until, type: uint32_t, initial_value: '0'}
  - {id: scan_at, type: uint32_t, initial_value: '0'}
  - {id: pending_detail, type: std::string}
  - {id: pw_ssid, type: std::string}
  - {id: net_names, type: 'std::vector<std::string>'}
  # Display settings from the document (docs/screen-document.md).
  - {id: day_brightness, type: int, initial_value: '100'}
  - {id: night_on, type: bool, initial_value: 'false'}
  - {id: night_from, type: int, initial_value: '0'}        # minutes past local midnight
  - {id: night_to, type: int, initial_value: '0'}
  - {id: night_brightness, type: int, initial_value: '20'}
  - {id: night_lift_until, type: uint32_t, initial_value: '0'}
  - {id: applied_brightness, type: int, initial_value: '-1'}
  # Firmware updates. Almost none of this is restored across boots: a manifest check is cheap, and
  # an interrupted install must start again from the manifest rather than from a half-written slot.
  # fw_pending is the exception. It holds the version this board is about to reboot into, so that
  # if the bootloader rolls the image back the old firmware finds it on the next boot and can say
  # which version failed. confirm_boot clears it. A version is digits and dots only (validated by
  # parse_firmware) and at most 16 characters, so 33 bytes is room to spare.
  - {id: fw_pending, type: 'char[33]', restore_value: true}
  - {id: boot_confirmed, type: bool, initial_value: 'false'}
  - {id: fw_check_at, type: uint32_t, initial_value: '0'}   # 0 until the backend has answered once
  - {id: fw_have_offer, type: bool, initial_value: 'false'}
  - {id: fw_offered, type: std::string}
  - {id: fw_url, type: std::string}
  - {id: fw_sha, type: std::string}
  - {id: fw_size, type: uint32_t, initial_value: '0'}
  - {id: fw_force, type: bool, initial_value: 'false'}
  - {id: fw_installing, type: bool, initial_value: 'false'}
  - {id: fw_result_body, type: std::string}
  - {id: fw_reboot_at, type: uint32_t, initial_value: '0'}
  - {id: fw_notice_until, type: uint32_t, initial_value: '0'}
  - {id: fw_pct_shown, type: int, initial_value: '-1'}

script:
  # ---- UI event dispatcher. hb_ui.h posts the same messages the fixed 1a pages posted.
  - id: ev
    parameters:
      msg: string
    then:
      - lambda: |-
          auto starts = [&](const char* p) { return msg.rfind(p, 0) == 0; };
          // Tap to refresh, at most once every 15 seconds (docs/api-v1.md).
          auto manual_refresh = [&]() {
            if (id(last_manual_refresh) && millis() - id(last_manual_refresh) < 15000) return;
            id(last_manual_refresh) = millis();
            id(next_poll_at) = millis();
          };

          lv_obj_t* nb[] = {id(net0), id(net1), id(net2), id(net3), id(net4), id(net5), id(net6)};
          auto start_scan = [&]() {
            for (auto* b : nb) lv_obj_add_flag(b, LV_OBJ_FLAG_HIDDEN);
            esp_err_t err = tb::wifi_scan_begin();
            if (err == ESP_OK) {
              lv_label_set_text(id(wifi_status), hb::copy::WIFI_SCANNING);
              id(scan_at) = millis() + 4000;
            } else {
              // The driver's reason is for the log, not for the wall: the only thing to do on
              // screen is tap the button again.
              ESP_LOGW("hb", "Wi-Fi scan failed: %s", esp_err_to_name(err));
              lv_label_set_text(id(wifi_status), hb::copy::WIFI_SCAN_FAILED);
            }
          };

          if (msg == "FACTORYRESET") {
            id(factory_reset).execute();
          } else if (msg == "BUTTON") {
            // A short press changes nothing on the board: it only lifts the backlight for two
            // minutes, which is how the board is read in a dark hall without touching the glass.
            id(night_lift_until) = millis() + 120000;
            id(apply_brightness).execute();
          } else if (msg == "BUTTONLONG" || msg == "WIFISCAN") {
            id(detail_until) = 0;
            id(lv).show_page(2, LV_SCR_LOAD_ANIM_NONE, 0);
            start_scan();
          } else if (starts("NET|")) {
            int n = atoi(msg.c_str() + 4);
            if (n < 0 || n >= (int) id(net_names).size()) return;
            id(pw_ssid) = id(net_names)[n];
            lv_label_set_text(id(wifi_pw_title),
                              (hb::copy::WIFI_PASSWORD_FOR + id(pw_ssid)).c_str());
            lv_textarea_set_text(id(pw_ta), "");
            id(lv).show_page(3, LV_SCR_LOAD_ANIM_NONE, 0);
          } else if (msg == "WIFICONNECT") {
            std::string pw = lv_textarea_get_text(id(pw_ta));
            ESP_LOGI("hb", "saving Wi-Fi credentials");
            wifi::global_wifi_component->save_wifi_sta(id(pw_ssid), pw);
            lv_textarea_set_text(id(pw_ta), "");
            std::string msg = hb::copy::WIFI_CONNECTING_TO + id(pw_ssid) + ".";
            lv_label_set_text(id(wifi_status), msg.c_str());
            hb::g_host.set_status(msg);
            id(lv).show_page(2, LV_SCR_LOAD_ANIM_NONE, 0);
          } else if (msg == "CANCEL") {
            // Close on either Wi-Fi page. The typed password is cleared rather than left in the
            // textarea for whoever walks past next.
            lv_textarea_set_text(id(pw_ta), "");
            id(lv).show_page(0, LV_SCR_LOAD_ANIM_NONE, 0);
          } else if (msg == "TOUCH" && id(detail_until)) {
            id(detail_until) = 0;
            id(lv).show_page(0, LV_SCR_LOAD_ANIM_NONE, 0);
          } else if (starts("SWIPE|")) {
            // Only reached with HB_CAROUSEL 0: with the carousel, LVGL scrolls the pages itself.
            id(detail_until) = 0;
            hb::g_host.step(msg == "SWIPE|L" ? 1 : -1);
          } else if (msg == "TOUCH") {
            // A tap pulls a fresh screen document and lifts the backlight out of night dimming.
            hb::g_host.touch();
            id(night_lift_until) = millis() + 120000;
            id(apply_brightness).execute();
            manual_refresh();
          } else if (starts("LONG|")) {
            auto* bv = hb::g_host.current_board();
            if (bv == nullptr) return;
            const std::string& uid = bv->uid_at(atoi(msg.c_str() + 5));
            if (uid.empty()) return;
            lv_label_set_text(id(detail_hdr), hb::copy::DETAIL_LOADING);
            lv_label_set_text(id(detail_body), "");
            id(lv).show_page(1, LV_SCR_LOAD_ANIM_NONE, 0);
            id(detail_until) = millis() + 60000;
            id(fetch_detail).execute(uid);
          }

  # ---- backlight and palette: the document's day brightness, the night window, and the two-minute
  # lift a touch during the night gives it. One second of transition either way.
  #
  # This script is the one place that decides whether the board is in its night, so the night
  # palette is switched here as well: the window comes from the household's settings in the portal
  # and the lift from the button, and the light and the colours must never disagree about which of
  # the two it is. Runs on a document, on a touch, on the time sync and every 60 s.
  - id: apply_brightness
    then:
      - lambda: |-
          int want = id(day_brightness);
          bool night = false;
          if (id(night_on)) {
            auto t = id(sntp_time).now();
            if (t.is_valid()) {
              int mins = t.hour * 60 + t.minute;
              int from = id(night_from), to = id(night_to);
              night = from < to ? (mins >= from && mins < to) : (mins >= from || mins < to);
              if (night) want = id(night_brightness);
            }
          }
          // A press or a tap lifts the board out of the night for two minutes, so it can be read
          // in a dark hall: full brightness and the day palette, then back down on its own.
          bool lifted = night && id(night_lift_until) &&
                        (int32_t) (millis() - id(night_lift_until)) < 0;
          if (lifted) want = id(day_brightness);
          // Before the early return below: the brightness can be unchanged (the two levels are
          // the same, or the lift put it back) while the palette still has to move. set_night is
          // itself a no-op when the state has not changed, so the 60 s tick costs nothing.
          hb::g_host.set_night(night && !lifted);
          if (want < 0) want = 0;
          if (want > 100) want = 100;
          if (want == id(applied_brightness)) return;
          id(applied_brightness) = want;
          if (want == 0) {
            auto c = id(backlight)->turn_off();
            c.set_transition_length(1000);
            c.perform();
          } else {
            auto c = id(backlight)->turn_on();
            c.set_brightness(want / 100.0f);
            c.set_transition_length(1000);
            c.perform();
          }

  # ---- pairing: POST /v1/pair/begin (the one route with no Authorization header)
  - id: fetch_pair
    then:
      - lambda: |-
          if (tb::g_fetcher.busy() || !tb::secret_valid(id(device_secret))) return;
          tb::Job j;
          j.kind = tb::JOB_PAIR;
          j.method = tb::M_POST;
          j.url = "${backend_base}/v1/pair/begin";
          j.body = std::string("{\"secret\":\"") + id(device_secret) +
                   "\",\"mac\":\"" + tb::mac_lower() + "\",\"fw\":\"${fw_version}\"}";
          tb::g_fetcher.submit(j);

  # ---- while unclaimed: GET /v1/device/config every 10 s until claimed comes back true
  - id: fetch_config
    then:
      - lambda: |-
          if (tb::g_fetcher.busy() || !tb::secret_valid(id(device_secret))) return;
          tb::Job j;
          j.kind = tb::JOB_CONFIG;
          j.url = "${backend_base}/v1/device/config";
          j.auth = std::string("Bearer ") + id(device_secret);
          tb::g_fetcher.submit(j);

  # ---- the whole screen in one document: GET /v1/device/screen, conditional on the stored ETag
  - id: fetch_screen
    then:
      - lambda: |-
          if (tb::g_fetcher.busy() || !tb::secret_valid(id(device_secret))) return;
          tb::Job j;
          j.kind = tb::JOB_SCREEN;
          j.url = "${backend_base}/v1/device/screen";
          j.auth = std::string("Bearer ") + id(device_secret);
          j.inm = id(screen_etag);
          tb::g_fetcher.submit(j);

  # ---- factory reset (8 to 15 s hold): erase everything this board has been told, then restart.
  # global_preferences->reset() erases the whole NVS partition rather than clearing the globals
  # one by one, so the saved Wi-Fi network goes with the device secret and the claim: a board that
  # changes hands must not carry the previous household's Wi-Fi password. Wi-Fi credentials are
  # only ever in ESPHome preferences (the esp-idf driver is put in WIFI_STORAGE_RAM and keeps no
  # copy of its own), so erasing the partition is enough. reset() also zeroes the NVS handle, so
  # the shutdown hooks safe_reboot() runs cannot write any of it back during the delay below.
  - id: factory_reset
    then:
      - lambda: |-
          ESP_LOGW("hb", "factory reset: erasing saved settings, restarting");
          hb::g_host.set_unpaired("");
          hb::g_host.set_status(hb::copy::FORGETTING);
          esphome::global_preferences->reset();
      - delay: 1500ms
      - lambda: |-
          App.safe_reboot();

  # ---- the boot is good once the backend has answered: the network, TLS, the credential and the
  # renderer have all worked end to end, which is the thing a rolled-back image would fail at.
  # safe_mode confirms the image anyway after ten minutes so an unreachable backend cannot cause a
  # rollback; a crash loop still rolls back through the bootloader long before that.
  - id: confirm_boot
    then:
      - lambda: |-
          if (id(boot_confirmed)) return;
          id(boot_confirmed) = true;
          id(safe_mode_1)->mark_successful();
          ESP_LOGI("hb", "boot confirmed");
          // This image has proved itself, so there is no rollback left to report.
          if (id(fw_pending)[0] != '\0') memset(id(fw_pending), 0, sizeof(id(fw_pending)));
          // First firmware check two minutes later, then every six hours.
          if (!id(fw_check_at)) id(fw_check_at) = millis() + 120000;
          if (id(fw_notice_until)) {
            id(fw_notice_until) = 0;
            hb::g_host.set_notice("");
          }

  # ---- calling points for one train (long press); queued if the fetcher is busy
  - id: fetch_detail
    parameters:
      uid: string
    then:
      - lambda: |-
          id(pending_detail) = uid;

  # ---- apply finished requests (runs from the 100 ms interval, on the main loop)
  - id: poll_fetcher
    then:
      - lambda: |-
          // Queued work, submitted as soon as the fetch task is free.
          if (!tb::g_fetcher.busy() && tb::secret_valid(id(device_secret)) && !id(fw_installing)) {
            if (id(claimed) && !id(pending_detail).empty()) {
              std::string sid = tb::url_token(id(pending_detail));
              if (sid.empty()) {
                id(pending_detail).clear();
              } else {
                tb::Job j;
                j.kind = tb::JOB_DETAIL;
                j.url = "${backend_base}/v1/device/service/" + sid;
                j.auth = std::string("Bearer ") + id(device_secret);
                if (tb::g_fetcher.submit(j)) id(pending_detail).clear();
              }
            } else if (!id(fw_result_body).empty() && wifi::global_wifi_component->is_connected()) {
              // How the install went, or that the bootloader rolled the image back, so a rollout
              // can be watched from the backend. Only with the network up: the rollback report is
              // written during on_boot, and submitting it before Wi-Fi is back would spend the one
              // attempt there is on a request that cannot leave the board.
              tb::Job j;
              j.kind = tb::JOB_FWRESULT;
              j.method = tb::M_POST;
              j.url = "${backend_base}/v1/device/firmware/result";
              j.auth = std::string("Bearer ") + id(device_secret);
              j.body = id(fw_result_body);
              if (tb::g_fetcher.submit(j)) id(fw_result_body).clear();
            } else if (wifi::global_wifi_component->is_connected() &&
                       id(pending_detail).empty() && !id(detail_until)) {
              // Firmware work never interrupts a detail fetch, and never runs with the network
              // down.
              bool window = false;
              if (id(fw_force) || !id(claimed)) {
                window = true;                       // forced, or unpaired and so not in use yet
              } else if (millis() > 86400000UL) {
                window = true;                       // up over a day: the quiet window was missed
              } else {
                auto t = id(sntp_time).now();
                window = t.is_valid() && t.hour >= 2 && t.hour < 5;   // 02:00 to 05:00 local
              }
              if (id(fw_have_offer) && window) {
                tb::Job j;
                j.kind = tb::JOB_OTA;
                j.url = id(fw_url);
                j.auth = std::string("Bearer ") + id(device_secret);
                j.sha = id(fw_sha);
                j.size = id(fw_size);
                j.tag = id(fw_offered);
                if (tb::g_fetcher.submit(j)) {
                  id(fw_installing) = true;
                  id(fw_have_offer) = false;
                  id(fw_pct_shown) = -1;
                  id(fw_notice_until) = 0;
                  ESP_LOGI("hb", "installing firmware %s, %u bytes", id(fw_offered).c_str(),
                           (unsigned) id(fw_size));
                  hb::g_host.set_notice(hb::copy::updating(id(fw_offered), 0));
                }
              } else if (!id(fw_have_offer) && id(fw_check_at) &&
                         (int32_t) (millis() - id(fw_check_at)) >= 0) {
                tb::Job j;
                j.kind = tb::JOB_FIRMWARE;
                j.url = "${backend_base}/v1/device/firmware";
                j.auth = std::string("Bearer ") + id(device_secret);
                // Six hours to the next check, set here so a failed check waits too.
                if (tb::g_fetcher.submit(j)) id(fw_check_at) = millis() + 21600000UL;
              }
            }
          }

          tb::Result r;
          if (!tb::g_fetcher.poll(r)) return;
          auto now = id(sntp_time).now();
          // Before SNTP has synced there is no time to quote. A sentence that would have ended
          // with one simply ends early: "Showing --:--" told nobody anything.
          std::string nowstr = now.is_valid() ? now.strftime("%H:%M") : "";
          // Status codes and byte counts only: never the secret, the document, or the ETag.
          ESP_LOGI("hb", "job %d: HTTP %d, %u bytes", (int) r.kind, r.status, (unsigned) r.body.size());

          // 401 on any device route means this device is no longer claimed: keep the secret,
          // forget the claim, and go back to pairing (docs/api-v1.md).
          if (r.status == 401 && r.kind != tb::JOB_PAIR) {
            ESP_LOGW("hb", "401 from the backend: returning to pairing");
            id(claimed) = false;
            id(screen_etag).clear();
            id(pair_code).clear();
            id(pair_expires_at) = 0;
            id(detail_until) = 0;
            id(pending_detail).clear();
            id(fw_have_offer) = false;   // an offer made to the old claim is not ours to install
            id(backoff_ms) = 0;
            id(next_poll_at) = millis();
            id(page_restored) = true;
            id(lv).show_page(0, LV_SCR_LOAD_ANIM_NONE, 0);
            hb::g_host.set_unpaired("");
            return;
          }

          if (r.kind == tb::JOB_DETAIL) {
            if (!id(detail_until)) return;   // user already left the detail page
            // A network error, an HTTP status and an answer that would not parse are three
            // things to the log and one thing to whoever is standing at the board.
            if (r.status != 200) {
              ESP_LOGW("hb", "calling points: HTTP %d", r.status);
              lv_label_set_text(id(detail_body), hb::copy::DETAIL_FAILED);
              return;
            }
            std::string hdr, text;
            if (!tb::parse_service(r.body, hdr, text)) {
              ESP_LOGW("hb", "calling points: could not be read");
              lv_label_set_text(id(detail_body), hb::copy::DETAIL_FAILED);
              return;
            }
            lv_label_set_text(id(detail_hdr), hdr.c_str());
            lv_label_set_text(id(detail_body), text.c_str());
            return;
          }

          // Firmware jobs have their own cadence and never touch the screen poll: a manifest that
          // is late, rate limited or missing must not slow the board down or paint an error on it.
          if (r.kind == tb::JOB_FIRMWARE) {
            if (r.status != 200) { ESP_LOGD("hb", "firmware check: HTTP %d", r.status); return; }
            tb::FwOffer offer;
            if (!tb::parse_firmware(r.body, offer)) {
              ESP_LOGW("hb", "firmware offer rejected: out of shape");
              return;
            }
            if (!offer.valid()) return;                      // nothing on offer
            if (offer.version == "${fw_version}") return;    // already running it
            id(fw_offered) = offer.version;
            id(fw_url) = offer.url;
            id(fw_sha) = offer.sha256;
            id(fw_size) = offer.size;
            id(fw_force) = offer.force;
            id(fw_have_offer) = true;
            ESP_LOGI("hb", "firmware %s offered, %u bytes%s", offer.version.c_str(),
                     (unsigned) offer.size, offer.force ? ", forced" : "");
            return;
          }

          if (r.kind == tb::JOB_OTA) {
            id(fw_installing) = false;
            id(fw_pct_shown) = -1;
            if (r.status == 200) {
              hb::g_host.set_notice(hb::copy::updating(r.tag, 100));
              // Written before the reboot below, and restored on the next boot whichever slot the
              // bootloader picks. The restoring global is saved within a second of changing and
              // again by the shutdown hooks, and the reboot is at least one backend round trip
              // away, so it is on flash before the board goes down.
              snprintf(id(fw_pending), sizeof(id(fw_pending)), "%s", r.tag.c_str());
              id(fw_result_body) = std::string("{\"version\":\"") + r.tag + "\",\"ok\":true}";
              // Reboot once the backend has been told, or after ten seconds either way.
              id(fw_reboot_at) = millis() + 10000;
              ESP_LOGI("hb", "firmware %s installed, restarting", r.tag.c_str());
            } else {
              hb::g_host.set_notice("");
              // The reason is in the log line below; the wall gets the sentence.
              hb::g_host.set_status(hb::copy::UPDATE_FAILED, true);
              id(fw_result_body) = std::string("{\"version\":\"") + r.tag +
                                   "\",\"ok\":false,\"error\":\"" + r.err + "\"}";
              ESP_LOGW("hb", "firmware %s failed: %s", r.tag.c_str(), r.err.c_str());
            }
            return;
          }

          if (r.kind == tb::JOB_FWRESULT) {
            if (id(fw_reboot_at)) {
              id(fw_reboot_at) = 0;
              ESP_LOGI("hb", "restarting into the new firmware");
              App.safe_reboot();
            }
            return;
          }

          if (r.status == 429) {
            id(next_poll_at) = millis() + 30000;
            hb::g_host.set_status(hb::copy::RATE_LIMITED, true);
            return;
          }
          if (r.status < 0 || r.status >= 500) {
            // While the boot sequence is still up, retry in 5 s rather than 30 so the help line
            // appears while somebody is still watching the screen.
            uint32_t first = hb::g_host.booting() ? 5000 : 30000;
            id(backoff_ms) = id(backoff_ms) ? std::min<uint32_t>(id(backoff_ms) * 2, 300000) : first;
            id(next_poll_at) = millis() + id(backoff_ms);
            ESP_LOGW("hb", "backend unreachable: HTTP %d, %s", r.status,
                     r.err.empty() ? "no reason given" : r.err.c_str());
            hb::g_host.set_status(hb::copy::with_showing(hb::copy::CANT_REACH, id(last_good_hm)),
                                  true);
            return;
          }
          id(backoff_ms) = 0;

          if (r.kind == tb::JOB_PAIR) {
            bool cl = false; std::string code; uint32_t expires = 900, poll = 10;
            if (r.status != 200 || !tb::parse_pair(r.body, cl, code, expires, poll)) {
              ESP_LOGW("hb", "pair/begin failed: HTTP %d", r.status);
              id(next_poll_at) = millis() + 30000;
              hb::g_host.set_status(hb::copy::PAIR_FAILED, true);
              return;
            }
            if (cl) {
              ESP_LOGI("hb", "already claimed, polling the screen");
              id(claimed) = true;
              id(pair_code).clear();
              id(pair_expires_at) = 0;
              id(next_poll_at) = millis();
            } else {
              ESP_LOGI("hb", "pairing code issued, valid for %u s", (unsigned) expires);
              id(pair_code) = code;
              id(pair_expires_at) = millis() + expires * 1000UL;
              id(next_poll_at) = millis() + poll * 1000UL;
              id(page_restored) = true;
              hb::g_host.set_unpaired(code);
            }
            return;
          }

          if (r.kind == tb::JOB_CONFIG) {
            bool cl = false; uint32_t poll = 10;
            if (r.status != 200 || !tb::parse_config(r.body, cl, poll)) {
              id(next_poll_at) = millis() + 10000;
              return;
            }
            if (cl) {
              ESP_LOGI("hb", "device claimed");
              id(claimed) = true;
              id(pair_code).clear();
              id(pair_expires_at) = 0;
              id(next_poll_at) = millis();   // fetch the screen document straight away
              hb::g_host.set_status(hb::copy::PAIRED_FETCHING);
            } else {
              id(next_poll_at) = millis() + poll * 1000UL;
              // An answer while unpaired proves the boot as well as a document does.
              id(confirm_boot).execute();
              // The code lasts 15 minutes; ask for a fresh one once it has run out.
              if (id(pair_expires_at) && (int32_t) (millis() - id(pair_expires_at)) >= 0) {
                id(pair_code).clear();
                id(pair_expires_at) = 0;
                id(next_poll_at) = millis();
              }
            }
            return;
          }

          // JOB_SCREEN. The backend says how soon to poll again (Poll-After, 15 to 1800 s,
          // captured by the fetcher); 60 s when the header is absent. Set before the 304
          // return so an unchanged document still picks up a cadence change.
          uint32_t next = r.poll_after ? r.poll_after : 60;
          if (r.poll_after) ESP_LOGD("hb", "poll-after %u s", (unsigned) r.poll_after);
          id(next_poll_at) = millis() + next * 1000UL;
          if (r.status == 304) {
            // Unchanged, so what is on the wall is current: keep showing it and say so is still
            // the answer if the next fetch fails.
            if (!nowstr.empty()) id(last_good_hm) = nowstr;
            return;
          }
          if (r.status != 200) {
            ESP_LOGW("hb", "screen fetch: HTTP %d", r.status);
            hb::g_host.set_status(hb::copy::with_showing(hb::copy::BACKEND_ERROR,
                                                         id(last_good_hm)), true);
            return;
          }
          hb::Document doc;
          if (!tb::parse_screen(r.body, doc)) {
            ESP_LOGW("hb", "screen document could not be read");
            hb::g_host.set_status(hb::copy::with_showing(hb::copy::CANT_READ_PAGES,
                                                         id(last_good_hm)), true);
            return;
          }
          if (!nowstr.empty()) id(last_good_hm) = nowstr;
          if (!r.etag.empty()) id(screen_etag) = r.etag;
          hb::g_host.set_document(doc);
          id(confirm_boot).execute();   // a rendered document is what a good boot means here
          // The household's timezone, as the POSIX string the clock component wants. Applied
          // before the brightness so the night window is judged against local time.
          if (!doc.tzp.empty() && doc.tzp != id(applied_tz)) {
            id(applied_tz) = doc.tzp;
            id(sntp_time).set_timezone(doc.tzp);
            ESP_LOGI("hb", "timezone applied from the document");
            hb::g_host.tick(id(sntp_time).now());
          }
          // Display settings ride along with the document; a missing block means full brightness.
          id(day_brightness) = doc.settings.brightness;
          id(night_on) = doc.settings.night.enabled;
          id(night_from) = doc.settings.night.from;
          id(night_to) = doc.settings.night.to;
          id(night_brightness) = doc.settings.night.brightness;
          id(apply_brightness).execute();
          // After a reboot the board comes back on the page it was left on.
          if (!id(page_restored)) {
            id(page_restored) = true;
            hb::g_host.show((size_t) id(cur_board), false);
          }
          ESP_LOGI("hb", "screen document applied: %u bytes, %u pages, %u on screen",
                   (unsigned) r.body.size(), (unsigned) doc.pages.size(), (unsigned) hb::g_host.count());
          ESP_LOGI("hb", "heap internal free %u largest %u | psram free %u largest %u | lvgl pages %u",
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL), (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL),
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_SPIRAM), (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_SPIRAM),
                   (unsigned) hb::g_host.object_count());

interval:
  # Backend scheduler. next_poll_at carries the whole cadence: 10 s while unclaimed (or whatever
  # /v1/device/config asks for), the Poll-After header on the screen response (60 s when absent),
  # immediately after a tap-to-refresh, 30 s after a 429, and 30 s doubling to 5 minutes after an
  # outage.
  - interval: 1s
    then:
      - lambda: |-
          if (!wifi::global_wifi_component->is_connected()) return;
          if (id(detail_until) || tb::g_fetcher.busy()) return;
          // An install owns the fetch task until it has reported and restarted.
          if (id(fw_installing) || id(fw_reboot_at) || !id(fw_result_body).empty()) return;
          // Queued work is submitted by poll_fetcher, but only while claimed: don't let it
          // stall the pairing poll before the device has been claimed.
          if (id(claimed) && !id(pending_detail).empty()) return;
          if (!tb::secret_valid(id(device_secret))) return;
          if ((int32_t) (millis() - id(next_poll_at)) < 0) return;
          if (id(claimed)) {
            id(fetch_screen).execute();
            return;
          }
          bool expired = id(pair_expires_at) && (int32_t) (millis() - id(pair_expires_at)) >= 0;
          if (id(pair_code).empty() || expired) id(fetch_pair).execute();
          else id(fetch_config).execute();
  # Clock tick for the clock page and the page headers, and the carousel position so the board
  # comes back on the same page after a reboot.
  - interval: 1s
    then:
      - lambda: |-
          hb::g_host.tick(id(sntp_time).now());
          if (id(page_restored) && (int) hb::g_host.current() != id(cur_board))
            id(cur_board) = (int) hb::g_host.current();
  # Night dimming: re-evaluate the window against local time once a minute.
  - interval: 60s
    then:
      - script.execute: apply_brightness
  - interval: 100ms
    then:
      # The boot sequence runs off this tick and goes first, so a status posted by poll_fetcher
      # in the same pass is seen on the next one rather than being written over immediately.
      - lambda: |-
          hb::g_host.tick_fast(millis());
      - script.execute: poll_fetcher
      - lambda: |-
          if (id(detail_until) && millis() > id(detail_until)) {
            id(detail_until) = 0;
            id(lv).show_page(0, LV_SCR_LOAD_ANIM_NONE, 0);
          }
          // Download progress is published by the fetch task and picked up here, the same way
          // results are, so nothing on the main loop ever blocks on the install.
          if (id(fw_installing)) {
            int pct = tb::g_ota_pct.load();
            if (pct >= 0 && pct != id(fw_pct_shown)) {
              id(fw_pct_shown) = pct;
              hb::g_host.set_notice(hb::copy::updating(id(fw_offered), pct));
            }
          }
          if (id(fw_reboot_at) && (int32_t) (millis() - id(fw_reboot_at)) >= 0) {
            id(fw_reboot_at) = 0;
            ESP_LOGI("hb", "restarting into the new firmware");
            App.safe_reboot();
          }
          if (id(fw_notice_until) && (int32_t) (millis() - id(fw_notice_until)) >= 0) {
            id(fw_notice_until) = 0;
            hb::g_host.set_notice("");
          }
          if (id(scan_at) && millis() > id(scan_at)) {
            id(scan_at) = 0;
            auto nets = tb::wifi_scan_results(7);
            lv_obj_t* nb[] = {id(net0), id(net1), id(net2), id(net3), id(net4), id(net5), id(net6)};
            lv_obj_t* nl[] = {id(net0_lbl), id(net1_lbl), id(net2_lbl), id(net3_lbl), id(net4_lbl), id(net5_lbl), id(net6_lbl)};
            lv_obj_t* ns[] = {id(net0_sig), id(net1_sig), id(net2_sig), id(net3_sig), id(net4_sig), id(net5_sig), id(net6_sig)};
            id(net_names).clear();
            for (int i = 0; i < 7; i++) {
              if (i < (int) nets.size()) {
                id(net_names).push_back(nets[i].ssid);
                lv_label_set_text(nl[i], nets[i].ssid.c_str());
                lv_label_set_text(ns[i], tb::signal_bars(nets[i].rssi));
                lv_obj_remove_flag(nb[i], LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_obj_add_flag(nb[i], LV_OBJ_FLAG_HIDDEN);
              }
            }
            std::string st = nets.empty() ? hb::copy::WIFI_NO_NETWORKS : hb::copy::WIFI_PICK;
            if (wifi::global_wifi_component->is_connected()) {
              char ssid[wifi::SSID_BUFFER_SIZE];
              st += std::string(hb::copy::WIFI_NOW_ON) +
                    wifi::global_wifi_component->wifi_ssid_to(ssid) + ".";
            }
            lv_label_set_text(id(wifi_status), st.c_str());
          }

# Factory reset band. hardware.yaml owns the user button and its 30 ms to 600 ms (BUTTON) and
# 700 ms to 6 s (Wi-Fi setup) bands; !extend appends a third band without editing that file.
binary_sensor:
  - id: !extend user_button
    on_click:
      - min_length: 8s
        max_length: 15s
        then:
          - script.execute: {id: ev, msg: "FACTORYRESET"}
